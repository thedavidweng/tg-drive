name: Site

# The project website (site/) goes to the root of the previews branch,
# which GitHub Pages serves at https://thedavidweng.github.io/tg-drive/.
# The UI preview's pr-*/ directories on that branch are left in place.
# See docs/release-and-ci.md.

on:
  push:
    branches: [main]
    paths:
      - site/**
      # The live demo is the frontend's demo build (ADR 0041).
      - frontend/**
      - assets/icon.png
      - assets/screenshot.png
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            site
            assets
            frontend
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.9.14
          install_args: node bun
      - name: Build the live demo
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build:demo
      - name: Publish the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node site/publish.mjs publish
