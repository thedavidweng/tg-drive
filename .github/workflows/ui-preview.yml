name: UI preview

# A pull request that changes the td-gui frontend or the GUI facade gets
# screenshots and a screen recording of the real app — built from the PR,
# driven by Playwright against the fake Telegram — in a marked block at the
# foot of its description. See ui-preview/ and docs/release-and-ci.md.
#
# Security split: the record job builds and runs the PR's code,
# so it holds a read-only token and no credentials. The publish job, which
# can write, only downloads the record job's artifacts; it checks out the
# default branch (trusted) for publish.mjs and never the PR's code. Fork
# pull requests get a read-only token regardless, so publish skips them.

on:
  pull_request:
    paths:
      - frontend/**
      - internal/gui/**
      - cmd/td-gui/**
      - ui-preview/**
      - .github/workflows/ui-preview.yml

concurrency:
  group: ui-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go, Node, and Bun at the versions pinned in mise.toml. The server
      # tag excludes the webview from the td-gui build, so unlike the gui
      # CI job this one needs no GTK/WebKitGTK.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: go node bun
      - name: Playwright, Chromium, and CJK fonts
        working-directory: ui-preview
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Record the scenes
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: ui-preview/run.sh out
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-preview
          path: out
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: record
    # Fork pull requests hold a read-only token whatever we ask for here.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default branch, for publish.mjs — never the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: ui-preview
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ui-preview
          path: out
      - name: Publish the preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUT_DIR: out
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node ui-preview/publish.mjs publish
