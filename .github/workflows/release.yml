name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: MOE AI LLC (NCFNX3LJ83)'
      APPLE_TEAM_ID: NCFNX3LJ83
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Dispatched runs come in on main; check out the tag explicitly.
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Prepare Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?}" "${APPLE_CERTIFICATE_PASSWORD:?}"
          : "${APPLE_API_KEY_BASE64:?}" "${APPLE_API_KEY_ID:?}" "${APPLE_API_ISSUER:?}"
          umask 077
          keychain="$RUNNER_TEMP/td-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/td-signing.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/td-notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/td-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/td-notary.p8" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/td-signing.p12"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # The 7 GiB macOS runner cannot fit two memory-heavy cross-builds.
          args: release --clean --parallelism 1 --timeout 75m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/td-signing.p12" "$RUNNER_TEMP/td-notary.p8"
          if [[ -f "$RUNNER_TEMP/td-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/td-signing.keychain-db"
          fi

  # td-gui packages are built natively per OS (the webview needs cgo on
  # Linux/macOS) and attached to the same release as the CLI artifacts.
  # macOS requires Developer ID signing and notarization. The
  # `release` job runs first so the GitHub Release always exists before
  # these jobs upload to it. GoReleaser builds the CLI without the gui tag.
  gui-linux:
    permissions:
      contents: write
    name: gui-linux (${{ matrix.runner }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Native arm64, like the CLI's linux_arm64 artifacts.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.14
          install_args: go bun
          cache: false
      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          tag="$TAG"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Package td-gui (deb + AppImage)
        env:
          GUI_VERSION: ${{ steps.version.outputs.version }}
        run: make gui-package-linux GUI_VERSION="$GUI_VERSION"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber

  gui-darwin:
    permissions:
      contents: write
    needs: release
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: MOE AI LLC (NCFNX3LJ83)'
      APPLE_TEAM_ID: NCFNX3LJ83
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.14
          install_args: go bun
          cache: false
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          tag="$TAG"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?}" "${APPLE_CERTIFICATE_PASSWORD:?}"
          : "${APPLE_API_KEY_BASE64:?}" "${APPLE_API_KEY_ID:?}" "${APPLE_API_ISSUER:?}"
          umask 077
          keychain="$RUNNER_TEMP/td-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/td-signing.p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/td-notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/td-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/td-notary.p8" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/td-signing.p12"
      - name: Package td-gui (universal dmg)
        env:
          GUI_VERSION: ${{ steps.version.outputs.version }}
        run: RELEASE_BUILD=true make gui-package-darwin GUI_VERSION="$GUI_VERSION"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/td-signing.p12" "$RUNNER_TEMP/td-notary.p8"
          if [[ -f "$RUNNER_TEMP/td-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/td-signing.keychain-db"
          fi

  gui-windows:
    permissions:
      contents: write
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.14
          install_args: go bun
          cache: false
      - name: Install make and NSIS
        run: choco install make nsis --no-progress -y
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          tag="$TAG"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Package td-gui (NSIS installer)
        env:
          GUI_VERSION: ${{ steps.version.outputs.version }}
        run: make gui-package-windows GUI_VERSION="$GUI_VERSION"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber
