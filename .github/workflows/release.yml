name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Dispatched runs come in on main; check out the tag explicitly.
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # Parallel cross-builds OOM a 16 GiB runner (GOMEMLIMIT in
          # .goreleaser.yaml caps each build; this caps how many run).
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # td-gui packages are built natively per OS (the webview needs cgo on
  # Linux/macOS) and attached to the same release as the CLI artifacts.
  # They are unsigned; the README documents Gatekeeper/SmartScreen. The
  # `release` job runs first so the GitHub Release always exists before
  # these jobs upload to it. The CLI artifacts are untouched: they come
  # from GoReleaser above, which never builds with the gui tag.
  gui-linux:
    name: gui-linux (${{ matrix.runner }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Native arm64, like the CLI's linux_arm64 artifacts.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: go bun
      - name: Install GTK 4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Package td-gui (deb + AppImage)
        run: make gui-package-linux GUI_VERSION=${{ steps.version.outputs.version }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber

  gui-darwin:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: go bun
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Package td-gui (universal dmg)
        run: make gui-package-darwin GUI_VERSION=${{ steps.version.outputs.version }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber

  gui-windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: go bun
      - name: Install make and NSIS
        run: choco install make nsis --no-progress -y
      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Package td-gui (NSIS installer)
        run: make gui-package-windows GUI_VERSION=${{ steps.version.outputs.version }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: gh release upload "$TAG" dist/gui/* --clobber
