name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify go.mod
        run: make mod-tidy-check
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
        continue-on-error: true

  # The desktop GUI (ADR 0031) links the platform webview through cgo, so it
  # is checked natively on each OS, apart from the CGO-free gates above. The
  # packaging steps double as the pull-request dry run for the release
  # workflow's GUI jobs: they exercise the same scripts with a placeholder
  # version and publish the result as a workflow artifact, never to a
  # release.
  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go and Bun at the versions pinned in mise.toml. The wails3 CLI
      # comes from make gui-tools (pinned in the Makefile); mise's go backend
      # drops the leading v when it runs go install, which fails on Ubuntu.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.14
          install_args: go bun
      - name: Install GTK 4 and WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install make and NSIS
        if: runner.os == 'Windows'
        run: choco install make nsis --no-progress -y
      - name: GUI check
        run: make check-gui
      - name: Build td-gui
        run: make gui-build
      - name: Package td-gui (dry run)
        run: |
          case "${{ runner.os }}" in
            Linux)   make gui-package-linux ;;
            macOS)   make gui-package-darwin ;;
            Windows) make gui-package-windows ;;
          esac
      - name: Upload GUI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: td-gui-package-${{ matrix.os }}
          path: dist/gui/

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-platform build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          # Parallel cross-builds OOM a 16 GiB runner (GOMEMLIMIT in
          # .goreleaser.yaml caps each build; this caps how many run).
          args: build --snapshot --clean --parallelism 2
