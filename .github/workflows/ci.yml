name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify go.mod
        run: make mod-tidy-check
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Test macOS signing gate
        run: python3 build/darwin/test-signing.py
      - name: Test
        run: go test -coverprofile=coverage.out ./...
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
        continue-on-error: true

# The desktop GUI links Wails' platform webview through cgo, so it is checked
# natively on each OS, apart from the CGO-free gates above. Linux is pinned to
# Ubuntu 22.04: Wails' gtk3 tag selects WebKitGTK 4.1 and keeps glibc at 2.35.
# The packaging steps double as the release workflow's dry run and smoke test.
  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and Bun at the versions pinned in mise.toml. The wails3 CLI
      # comes from make gui-tools (pinned in the Makefile); mise's go backend
      # drops the leading v when it runs go install, which fails on Ubuntu.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.14
          install_args: go bun
      - name: Install GTK3 and WebKitGTK 4.1
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libgtk-3-dev libwebkit2gtk-4.1-dev zsync xvfb xdotool imagemagick squashfs-tools libfuse2
      - name: Install make and NSIS
        if: runner.os == 'Windows'
        run: choco install make nsis --no-progress -y
      - name: GUI check
        run: make check-gui
      - name: Build td-gui
        run: make gui-build
      - name: Package td-gui (dry run)
        run: |
          case "${{ runner.os }}" in
            Linux)   make gui-package-linux ;;
            macOS)   make gui-package-darwin ;;
            Windows) make gui-package-windows ;;
          esac
      - name: Verify Linux AppImage metadata and offline GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/smoke-gui-appimage.sh dist/gui/*.AppImage
      - name: Upload GUI packages and smoke screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: td-gui-package-${{ matrix.os }}
          path: |
            dist/gui/
            ${{ runner.temp }}/td-gui-appimage-smoke.png

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-platform build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          # Parallel cross-builds OOM a 16 GiB runner (GOMEMLIMIT in
          # .goreleaser.yaml caps each build; this caps how many run).
          args: build --snapshot --clean --parallelism 2
