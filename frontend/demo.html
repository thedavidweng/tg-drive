<!doctype html>
<html lang="en" data-platform="darwin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>td demo</title>
    <script>
      // The manual theme override (src/theme.ts) applies before first paint.
      try {
        var t = localStorage.getItem("td-theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
