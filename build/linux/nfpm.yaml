# nfpm configuration for the td-gui .deb package. Consumed by
# `wails3 tool package` (which embeds nfpm) from build/linux/package.sh;
# VERSION and DEBARCH are expanded from the environment by nfpm.
name: td-gui
arch: ${DEBARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: thedavidweng <noreply@github.com>
vendor: thedavidweng
homepage: https://github.com/thedavidweng/tg-drive
description: Desktop GUI for td, the Telegram-backed virtual file tree
license: AGPL-3.0-only
contents:
  - src: dist/td-gui
    dst: /usr/bin/td-gui
  - src: assets/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/td-gui.png
  - src: build/linux/td-gui.desktop
    dst: /usr/share/applications/td-gui.desktop
# GTK3 + WebKitGTK 4.1 runtime (Ubuntu 22.04+ / Debian with WebKit 4.1).
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
